{% extends "base.html" %}

{% block title %}
New Prediction — ChurnShield AI
{% endblock %}

{% block body_class %}
app-page
{% endblock %}

{% block content %}

<h1 class="page-title">
  New Churn Prediction
</h1>

<div class="predict-form-card">

  <form method="POST"
        action="{{ url_for('predict') }}">

    <!-- CUSTOMER INFO -->
    <div class="form-section">

      <h3>
        Customer Info
      </h3>

      <div class="form-grid">

        <div class="form-group">

          <label>
            Customer ID
          </label>

          <input type="text"
                 name="customer_id"
                 class="form-input">

        </div>

        <div class="form-group">

          <label>
            Gender
          </label>

          <select name="gender"
                  class="form-input">

            <option value="Male">
              Male
            </option>

            <option value="Female">
              Female
            </option>

          </select>

        </div>

        <div class="form-group">

          <label>
            Senior Citizen
          </label>

          <select name="SeniorCitizen"
                  class="form-input">

            <option value="0">
              No
            </option>

            <option value="1">
              Yes
            </option>

          </select>

        </div>

        <div class="form-group">

          <label>
            Partner
          </label>

          <select name="Partner"
                  class="form-input">

            <option value="Yes">
              Yes
            </option>

            <option value="No">
              No
            </option>

          </select>

        </div>

        <div class="form-group">

          <label>
            Dependents
          </label>

          <select name="Dependents"
                  class="form-input">

            <option value="Yes">
              Yes
            </option>

            <option value="No">
              No
            </option>

          </select>

        </div>

      </div>

    </div>

    <!-- SERVICE DETAILS -->
    <div class="form-section">

      <h3>
        Service Details
      </h3>

      <div class="form-grid">

        <div class="form-group">

          <label>
            Tenure (months)
          </label>

          <input type="number"
                 name="tenure"
                 id="tenure"
                 class="form-input"
                 required>

        </div>

        <div class="form-group">

          <label>
            Phone Service
          </label>

          <select name="PhoneService"
                  class="form-input">

            <option value="Yes">
              Yes
            </option>

            <option value="No">
              No
            </option>

          </select>

        </div>

        <div class="form-group">

          <label>
            Multiple Lines
          </label>

          <select name="MultipleLines"
                  class="form-input">

            <option value="Yes">
              Yes
            </option>

            <option value="No">
              No
            </option>

            <option value="No phone service">
              No phone service
            </option>

          </select>

        </div>

        <div class="form-group">

          <label>
            Internet Service
          </label>

          <select name="InternetService"
                  class="form-input">

            <option value="DSL">
              DSL
            </option>

            <option value="Fiber optic">
              Fiber optic
            </option>

            <option value="No">
              No
            </option>

          </select>

        </div>

      </div>

    </div>

    <!-- ADDITIONAL SERVICES -->
    <div class="form-section">

      <h3>
        Additional Services
      </h3>

      <div class="form-grid">

        <div class="form-group">

          <label>
            Online Security
          </label>

          <select name="OnlineSecurity"
                  class="form-input">

            <option>Yes</option>
            <option>No</option>

          </select>

        </div>

        <div class="form-group">

          <label>
            Online Backup
          </label>

          <select name="OnlineBackup"
                  class="form-input">

            <option>Yes</option>
            <option>No</option>

          </select>

        </div>

        <div class="form-group">

          <label>
            Device Protection
          </label>

          <select name="DeviceProtection"
                  class="form-input">

            <option>Yes</option>
            <option>No</option>

          </select>

        </div>

        <div class="form-group">

          <label>
            Tech Support
          </label>

          <select name="TechSupport"
                  class="form-input">

            <option>Yes</option>
            <option>No</option>

          </select>

        </div>

        <div class="form-group">

          <label>
            Streaming TV
          </label>

          <select name="StreamingTV"
                  class="form-input">

            <option>Yes</option>
            <option>No</option>

          </select>

        </div>

        <div class="form-group">

          <label>
            Streaming Movies
          </label>

          <select name="StreamingMovies"
                  class="form-input">

            <option>Yes</option>
            <option>No</option>

          </select>

        </div>

      </div>

    </div>

    <!-- BILLING -->
    <div class="form-section">

      <h3>
        Billing
      </h3>

      <div class="form-grid">

        <div class="form-group">

          <label>
            Contract
          </label>

          <select name="Contract"
                  class="form-input">

            <option value="Month-to-month">
              Month-to-month
            </option>

            <option value="One year">
              One year
            </option>

            <option value="Two year">
              Two year
            </option>

          </select>

        </div>

        <div class="form-group">

          <label>
            Paperless Billing
          </label>

          <select name="PaperlessBilling"
                  class="form-input">

            <option value="Yes">
              Yes
            </option>

            <option value="No">
              No
            </option>

          </select>

        </div>

        <div class="form-group">

          <label>
            Payment Method
          </label>

          <select name="PaymentMethod"
                  class="form-input">

            <option value="Electronic check">
              Electronic check
            </option>

            <option value="Mailed check">
              Mailed check
            </option>

            <option value="Bank transfer (automatic)">
              Bank transfer
            </option>

            <option value="Credit card (automatic)">
              Credit card
            </option>

          </select>

        </div>

        <div class="form-group">

          <label>
            Monthly Charges
          </label>

          <input type="number"
                 name="MonthlyCharges"
                 id="monthlyCharges"
                 class="form-input"
                 required>

        </div>

        <div class="form-group">

          <label>
            Total Charges
          </label>

          <input type="number"
                 name="TotalCharges"
                 id="totalCharges"
                 class="form-input"
                 readonly
                 required>

        </div>

      </div>

    </div>

    <!-- SUBMIT -->
    <div class="form-actions">

      <button type="submit"
              class="btn btn-primary">

        Predict

      </button>

    </div>

  </form>

</div>

<!-- AUTO TOTAL CHARGES -->
<script>

const tenureInput = document.getElementById("tenure");

const monthlyInput = document.getElementById("monthlyCharges");

const totalInput = document.getElementById("totalCharges");

function calculateTotal() {

    const tenure = parseFloat(tenureInput.value) || 0;

    const monthly = parseFloat(monthlyInput.value) || 0;

    const total = tenure * monthly;

    totalInput.value = total.toFixed(2);
}

tenureInput.addEventListener("input", calculateTotal);

monthlyInput.addEventListener("input", calculateTotal);

</script>

{% endblock %}
