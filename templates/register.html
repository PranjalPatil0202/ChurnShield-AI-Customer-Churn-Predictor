{% extends "base.html" %}
{% block title %}Register — ChurnShield AI{% endblock %}
{% block body_class %}auth-page{% endblock %}
{% block content %}

<div class="auth-bg">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
</div>

<div class="auth-container">
  <div class="auth-card">
    <div class="auth-logo"><a href="/"><span class="brand-icon">◈</span> ChurnShield<span class="brand-ai"> AI</span></a></div>
    <h2 class="auth-title">Create Account</h2>
    <p class="auth-sub">Start predicting churn for free</p>

    <form method="POST" action="{{ url_for('register') }}" class="auth-form" id="regForm">
      <div class="form-group">
        <label><i class="fa fa-user"></i> Full Name</label>
        <input type="text" name="full_name" class="form-input" placeholder="Pranjal Sharma" required
               value="{{ full_name or '' }}"/>
      </div>
      <div class="form-group">
        <label><i class="fa fa-envelope"></i> Email Address</label>
        <input type="email" name="email" class="form-input" placeholder="you@example.com" required
               value="{{ email or '' }}"/>
      </div>
      <div class="form-group">
        <label><i class="fa fa-lock"></i> Password</label>
        <div class="input-group">
          <input type="password" name="password" class="form-input" id="pwField" placeholder="Min 6 characters" required/>
          <button type="button" class="input-addon" onclick="togglePw('pwField',this)"><i class="fa fa-eye"></i></button>
        </div>
      </div>
      <div class="form-group">
        <label><i class="fa fa-lock"></i> Confirm Password</label>
        <div class="input-group">
          <input type="password" name="confirm_password" class="form-input" id="cpField" placeholder="Repeat password" required/>
          <button type="button" class="input-addon" onclick="togglePw('cpField',this)"><i class="fa fa-eye"></i></button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="regBtn">
        <span class="btn-text"><i class="fa fa-user-plus"></i> Create Account</span>
        <span class="btn-loader hidden"><i class="fa fa-spinner fa-spin"></i> Creating...</span>
      </button>
    </form>

    <div class="auth-footer">
      Already have an account? <a href="{{ url_for('login') }}">Sign in</a>
    </div>
  </div>
</div>
{% endblock %}
